<div class="flex">
  <div class="columns-6 mx-20 gap-y-10 overflow-y-auto">
    @for (image of images(); track image.id) {
      <div class="image-card *:rounded-2xl p-2">
        <img
          [src]="image.imageUrl"
          [alt]="image.name"
          [style.height.px]="image.height"
          class="w-full object-cover aspect-square"
        />
      </div>
    }
  </div>
</div>
